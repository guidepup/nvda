name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./nvda/* `
            -DestinationPath "guidepup-nvda-${{ github.event.release.tag_name }}.zip" `
            -CompressionLevel Optimal

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload `
            "${{ github.event.release.tag_name }}" `
            "guidepup-nvda-${{ github.event.release.tag_name }}.zip" `
            --clobber
